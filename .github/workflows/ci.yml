name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install pinned Python quality tools
        run: python -m pip install ruff==0.15.13

      - name: Lint Python sources
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            build-dir: build-ci-debug
            build-type: Debug
            cmake-args: ""
          - name: Release
            build-dir: build-ci-release
            build-type: Release
            cmake-args: ""
          - name: ASAN UBSAN
            build-dir: build-ci-sanitize
            build-type: Debug
            cmake-args: "-DEIGENBOOK_ENABLE_ASAN=ON -DEIGENBOOK_ENABLE_UBSAN=ON"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B "${{ matrix.build-dir }}"
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          ${{ matrix.cmake-args }}

      - name: Confirm benchmark target builds
        if: matrix.build-type == 'Release'
        run: cmake --build "${{ matrix.build-dir }}" --parallel --target eigenbook_bench

      - name: Build tests, examples, and benchmarks
        run: cmake --build "${{ matrix.build-dir }}" --parallel

      - name: Run benchmark text and JSON smoke tests
        if: matrix.build-type == 'Release'
        run: >
          ctest --test-dir "${{ matrix.build-dir }}" --output-on-failure
          --label-regex '^benchmark$'

      - name: Run zero-allocation hot-path guard
        if: matrix.build-type == 'Debug' || matrix.build-type == 'Release'
        run: >
          ctest --test-dir "${{ matrix.build-dir }}" --output-on-failure
          --label-regex '^allocation$'

      - name: Run installed-package consumer smoke
        run: >
          ctest --test-dir "${{ matrix.build-dir }}" --output-on-failure
          --label-regex '^package$'

      - name: Run tests
        run: ctest --test-dir "${{ matrix.build-dir }}" --output-on-failure

  multi-config:
    name: Ninja multi-config Debug and Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Configure Ninja multi-config build
        run: >
          cmake -S . -B build-ci-multi -G "Ninja Multi-Config"
          -DCMAKE_CONFIGURATION_TYPES="Debug;Release"

      - name: Build and test Debug configuration
        run: |
          cmake --build build-ci-multi --config Debug --parallel
          ctest --test-dir build-ci-multi --build-config Debug --output-on-failure

      - name: Build and test Release configuration
        run: |
          cmake --build build-ci-multi --config Release --parallel
          ctest --test-dir build-ci-multi --build-config Release --output-on-failure

  macos-native:
    name: macOS native and package smoke
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure Release build
        run: cmake -S . -B build-ci-macos -DCMAKE_BUILD_TYPE=Release

      - name: Build with strict warnings
        run: cmake --build build-ci-macos --parallel

      - name: Run native, allocation, package, and benchmark tests
        run: ctest --test-dir build-ci-macos --output-on-failure

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install macOS Python package
        run: python -m pip install .

      - name: Import macOS package outside the source tree
        working-directory: ${{ runner.temp }}
        run: >
          python -I -c
          "import eigenbook; print(eigenbook.__version__, eigenbook.NATIVE_COMPILER)"

  python-core:
    name: Python ${{ matrix.python-version }} core install
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core package and test tools
        run: python -m pip install '.[test]'

      - name: Verify isolated core import and optional-dependency boundary
        working-directory: ${{ runner.temp }}
        run: |
          python -I - <<'PY'
          import importlib.metadata
          import importlib.util

          assert importlib.util.find_spec("gymnasium") is None
          import eigenbook

          assert importlib.metadata.version("eigenbook") == eigenbook.__version__
          assert importlib.util.find_spec("eigenbook._eigenbook") is not None
          try:
              from eigenbook import LimitOrderBookEnv  # noqa: F401
          except ModuleNotFoundError as error:
              assert "eigenbook[rl]" in str(error)
          else:
              raise AssertionError("core install unexpectedly exposes the RL environment")
          PY

      - name: Run core package suite
        working-directory: ${{ runner.temp }}
        run: >
          python -m pytest
          -c "${{ github.workspace }}/pyproject.toml"
          --basetemp "${{ runner.temp }}/eigenbook-core-pytest"
          -m "not rl and not training"
          "${{ github.workspace }}/tests"
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: "${{ github.workspace }}"

  python-all-extras:
    name: Python 3.12 all extras and full test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify repository-owned CI inputs are tracked
        run: >
          git ls-files --error-unmatch
          benchmarks/bench_python_env.py
          scripts/train_ppo.py
          tests/fixtures/market_data/valid_atomic.csv

      - name: Install package with every optional extra
        run: python -m pip install '.[rl,training,benchmark,test]'

      - name: Discover and run the complete Python suite
        working-directory: ${{ runner.temp }}
        run: >
          python -m pytest
          -c "${{ github.workspace }}/pyproject.toml"
          --basetemp "${{ runner.temp }}/eigenbook-all-extras-pytest"
          "${{ github.workspace }}/tests"
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: "${{ github.workspace }}"

      - name: Run train-save-load-evaluate smoke cycle
        working-directory: ${{ runner.temp }}
        run: >
          python "${{ github.workspace }}/scripts/train_ppo.py"
          --market-data "${{ github.workspace }}/tests/fixtures/market_data/valid_atomic.csv"
          --evaluation-market-data "${{ github.workspace }}/tests/fixtures/market_data/valid_atomic.csv"
          --symbol BTCUSDT
          --venue binance_spot
          --data-mode depth_trades
          --price-scale 100
          --quantity-scale 1000
          --training-timesteps 8
          --evaluation-steps 4
          --seed 7
          --model-path "${{ runner.temp }}/eigenbook-ppo-smoke/agent"
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Run Python/native boundary benchmark smoke
        working-directory: ${{ runner.temp }}
        run: >
          python "${{ github.workspace }}/benchmarks/bench_python_env.py"
          --iterations 20
          --warmup 5

  python-wheel:
    name: Build and install wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir wheelhouse

      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          wheel=$(find wheelhouse -name '*.whl' -print -quit)
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install \
            "${wheel}[rl,training,benchmark,test]"

      - name: Import wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: >
          "${RUNNER_TEMP}/wheel-venv/bin/python" -I -c
          "import eigenbook; print(eigenbook.__version__)"

      - name: Run complete suite against the installed wheel
        working-directory: ${{ runner.temp }}
        run: >
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pytest
          -c "${GITHUB_WORKSPACE}/pyproject.toml"
          --basetemp "${RUNNER_TEMP}/eigenbook-wheel-pytest"
          "${GITHUB_WORKSPACE}/tests"
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: "${{ github.workspace }}"

  fuzz-smoke:
    name: Clang fuzz smoke
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install matched Clang and libFuzzer runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 libclang-rt-18-dev

      - name: Configure fuzzers
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake -S . -B build-ci-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DEIGENBOOK_BUILD_FUZZERS=ON
          -DEIGENBOOK_BUILD_BENCHMARKS=OFF
          -DEIGENBOOK_BUILD_EXAMPLES=OFF

      - name: Build fuzzers
        run: cmake --build build-ci-fuzz --parallel

      - name: Run bounded fuzz smoke tests
        run: >
          ctest --test-dir build-ci-fuzz --output-on-failure
          --tests-regex '^eigenbook_fuzz_.*_smoke$'

      - name: Preserve failing fuzz input
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: eigenbook-fuzz-failure
          path: build-ci-fuzz/fuzz-artifacts/
          if-no-files-found: ignore

  static-analysis:
    name: Clang 18 static analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Clang analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-tidy-18

      - name: Configure focused clang-tidy checks
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake -S . -B build-ci-analysis
          -DCMAKE_BUILD_TYPE=Debug
          -DEIGENBOOK_BUILD_TESTS=OFF
          -DEIGENBOOK_BUILD_BENCHMARKS=OFF
          -DEIGENBOOK_BUILD_EXAMPLES=OFF
          -DEIGENBOOK_ENABLE_CLANG_TIDY=ON
          -DEIGENBOOK_CLANG_TIDY_EXECUTABLE=clang-tidy-18

      - name: Analyze production headers
        run: >
          cmake --build build-ci-analysis --parallel
          --target eigenbook_static_analysis
