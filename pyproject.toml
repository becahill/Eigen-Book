[build-system]
requires = [
    "scikit-build-core>=0.11.6",
    "pybind11>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "eigenbook"
dynamic = ["version"]
description = "C++20 low-latency limit order book and matching engine"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=1.0,<2",
]
training = [
    "gymnasium>=1.2,<1.4",
    "stable-baselines3>=2.9,<3",
]
benchmark = [
    "gymnasium>=1.0,<2",
]
test = [
    "pytest>=8,<10",
    "ruff==0.15.13",
]

[project.urls]
Repository = "https://github.com/becahill/Eigen-Book"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
wheel.packages = ["src/eigenbook"]
install.components = ["python"]

[tool.scikit-build.cmake.define]
EIGENBOOK_BUILD_PYTHON = true
EIGENBOOK_BUILD_TESTS = false
EIGENBOOK_BUILD_BENCHMARKS = false
EIGENBOOK_BUILD_EXAMPLES = false
EIGENBOOK_BUILD_FUZZERS = false
BUILD_TESTING = false

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '''(?s)project\s*\(\s*EigenBook\s+VERSION\s+(?P<value>\d+\.\d+\.\d+)'''

[[tool.scikit-build.generate]]
path = "eigenbook/_version.py"
template = '''
__version__ = "${version}"
'''

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "rl: requires the optional Gymnasium dependency",
    "training: requires the optional Stable-Baselines3 training dependencies",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
